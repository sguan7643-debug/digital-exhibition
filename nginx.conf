daemon off;

worker_processes  auto;
worker_cpu_affinity auto;

error_log /nginx_error.log  warn;
pid /nginx.pid;

events {
    use epoll;
    worker_connections  1024;
}

http {
    server_tokens off;
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /access.log  main;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 100;
    client_body_buffer_size         1024K;
    client_max_body_size            300m;
    gzip                            on;
    gzip_min_length                 100;
    gzip_types                      text/plain application/javascript text/css application/json application/xml text/javascript;

    server {
        listen      80;
        access_log /shuzhizhanting_web_access.log main;
        error_log /shuzhizhanting_web_error.log warn;

        location = /index.html {
            root /dist;
            add_header Cache-Control "no-cache";
        }

        location /assets/ {
            root /dist;
            try_files $uri =404;
        }

        location / {
            root /dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
