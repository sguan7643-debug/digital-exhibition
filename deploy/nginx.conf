# Example: place this server block in the existing Nginx http context.
# Copy the CONTENTS of dist/ into the root directory below.
server {
    listen 80;
    server_name _;
    root /var/www/digital-exhibition;
    index index.html;
    include /etc/nginx/mime.types;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Missing assets must return 404, not the SPA HTML entry.
    location /assets/ {
        try_files $uri =404;
    }

    # Support direct visits and refreshes on client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
